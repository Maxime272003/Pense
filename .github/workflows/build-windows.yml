name: Build Windows

# Les branches de travail : on vérifie que tout compile, sans publier ni signer (main passe par release.yml).
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Vérifications
        run: |
          npm run check
          npm test

      - name: Installateur
        run: npx tauri build --config src-tauri/tauri.unsigned.conf.json

      - uses: actions/upload-artifact@v7
        with:
          name: Pense-installateur-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
