name: Release

# Chaque push sur main publie une nouvelle version : l'app installée la propose au prochain contrôle.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clé de signature présente
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Ajoute le secret TAURI_SIGNING_PRIVATE_KEY (voir README, section Mises à jour)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Vérifications
        run: |
          npm run check
          npm test

      # 0.1.<numéro du run> : toujours croissant, sans avoir à modifier la version à la main.
      - name: Numéro de version
        shell: bash
        run: |
          VERSION="0.1.${{ github.run_number }}"
          node -e '
            const fs = require("fs");
            const f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          ' "$VERSION"
          echo "Version $VERSION"

      - name: Compilation, signature et publication
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: Pense __VERSION__
          releaseBody: Version publiée automatiquement depuis le commit ${{ github.sha }}.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
